<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact Green chart</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1600px; height: 900px; background: #060a03">
<dc-import name="ChartMap" theme="{{theme}}" hint-size="1600px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"line": {"editor": "color", "default": "#c9d65a"}, "warm": {"editor": "color", "default": "#f5e94a"}, "alert": {"editor": "color", "default": "#ff6a3a"}, "$preview": {"width": 1600, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    var t = {'name': 'CONTACT', 'tag': 'MCRN // CONTACT PLOT'};
    t.line = this.props.line ?? '#c9d65a';
    t.warm = this.props.warm ?? '#f5e94a';
    t.alert = this.props.alert ?? '#ff6a3a';
    return { theme: t };
  }
}
</script>
</body>
</html>
