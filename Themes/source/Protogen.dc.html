<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Protogen Cyan HUD theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1600px; height: 900px; background: #03070a">
<dc-import name="HudMap" theme="{{theme}}" hint-size="1600px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"line":{"editor":"color","default":"#5fe6ee"},"warm":{"editor":"color","default":"#ff7ad9"},"alert":{"editor":"color","default":"#ff4a6a"},"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: {
        name: 'PROTOGEN CYAN', code: 'PGS', tag: 'PROTOGEN SYSTEMS // NAV CORE',
        bg: '#03070a', neb: '#1fb8c8', sub: '#96d6dc', text: '#dcfbff', hi: '#8ff7ff',
        burn: '#ff9a4a', coast: '#f0feff', brake: '#ff7ad9',
        line: this.props.line ?? '#5fe6ee', warm: this.props.warm ?? '#ff7ad9', alert: this.props.alert ?? '#ff4a6a'
      }
    };
  }
}
</script>
</body>
</html>
