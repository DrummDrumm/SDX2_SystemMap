<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ember chart</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1600px; height: 900px; background: #0a0302">
<dc-import name="ChartMap" theme="{{theme}}" hint-size="1600px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"line": {"editor": "color", "default": "#e2b04a"}, "warm": {"editor": "color", "default": "#ffd44a"}, "alert": {"editor": "color", "default": "#ff4a3a"}, "$preview": {"width": 1600, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    var t = {'name': 'EMBER', 'tag': 'MCRN // FIRE CONTROL CHART', 'title': '#fff1d6', 'bezel': '#1f0a05', 'bg': '#160604', 'panel': '#1a0805', 'ring': '#f2c86a', 'grid': '#a0502a', 'text': '#f8e8c8', 'sub': '#c8a070', 'planet': '#3a160a', 'box': 'rgba(120,40,20,0.65)', 'hi': '#8ef04e', 'burn': '#ff7a2e', 'brake': '#ffd44a', 'hexA': 0.06, 'secs': ['#ffd44a', '#8ef04e', '#8ef04e', '#8ef04e', '#8a6a50']};
    t.line = this.props.line ?? '#e2b04a';
    t.warm = this.props.warm ?? '#ffd44a';
    t.alert = this.props.alert ?? '#ff4a3a';
    return { theme: t };
  }
}
</script>
</body>
</html>
