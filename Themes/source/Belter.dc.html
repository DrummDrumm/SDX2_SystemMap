<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Belter Amber HUD theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1600px; height: 900px; background: #0a0704">
<dc-import name="HudMap" theme="{{theme}}" hint-size="1600px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"line":{"editor":"color","default":"#ffa53a"},"warm":{"editor":"color","default":"#3fd6c6"},"alert":{"editor":"color","default":"#ff4a2a"},"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: {
        name: 'BELTER AMBER', code: 'OPA', tag: 'OPA // SALVAGE NAV, OYE',
        bg: '#0a0704', neb: '#c8781e', sub: '#e0b07a', text: '#ffe6c4', hi: '#ffc266',
        burn: '#ff7a1e', coast: '#fff2de', brake: '#3fd6c6',
        line: this.props.line ?? '#ffa53a', warm: this.props.warm ?? '#3fd6c6', alert: this.props.alert ?? '#ff4a2a'
      }
    };
  }
}
</script>
</body>
</html>
